# Moodle Plugin CI for local_releasegate.
#
# Based on the official moodle-plugin-ci GitHub Actions example
# (https://moodlehq.github.io/moodle-plugin-ci/GHAFileExplained.html).
# Status: CI green on 2026-10-02, run 36985100677 (all 8 matrix jobs, 22 PHPUnit tests).
# Behat enabled with Chrome service; feature files in tests/behat/.
#
# Layout assumption: this folder is the root of the plugin repository, so that
# "path: plugin" below checks out the plugin itself.
#
# Supported matrix (owner decision, doc 05 section 12):
#   Moodle 4.5 LTS (PHP 8.1 to 8.3), 5.0 and 5.1 (PHP 8.2 to 8.4), 5.3 LTS (PHP 8.3 to 8.4).
# Database: MySQL first. MariaDB and PostgreSQL are prepared below as comments.
#
# To enable MariaDB or PostgreSQL later:
#   1. Uncomment its service block under "services".
#   2. Add matrix entries with "database: mariadb" or "database: pgsql" (one include item per job).
# The official example uses 'mariadb' and 'pgsql' as the DB values. The 'mysqli' value
# for MySQL is expected to work but has not been confirmed in this repository: check the
# first run.

name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental == true }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      # Chrome is required for the behat --profile chrome step.
      # selenium/standalone-chrome exposes ChromeDriver on port 4444.
      chrome:
        image: selenium/standalone-chrome:latest
        options: --add-host=host.docker.internal:host-gateway

      # mariadb:
      #   image: mariadb:10
      #   env:
      #     MYSQL_USER: 'root'
      #     MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      #     MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
      #     MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
      #   ports:
      #     - 3306:3306
      #   options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
      #
      # postgres:
      #   image: postgres:13
      #   env:
      #     POSTGRES_USER: 'postgres'
      #     POSTGRES_HOST_AUTH_METHOD: 'trust'
      #   ports:
      #     - 5432:5432
      #   options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      #
      # Note: mysql and mariadb both use port 3306. Run only one of them per job, or give
      # one a different host port and pass --db-port to moodle-plugin-ci install.

    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: mysqli, moodle-branch: MOODLE_405_STABLE, php: '8.1' }
          - { database: mysqli, moodle-branch: MOODLE_405_STABLE, php: '8.3' }
          - { database: mysqli, moodle-branch: MOODLE_500_STABLE, php: '8.2' }
          - { database: mysqli, moodle-branch: MOODLE_500_STABLE, php: '8.4' }
          - { database: mysqli, moodle-branch: MOODLE_501_STABLE, php: '8.2' }
          - { database: mysqli, moodle-branch: MOODLE_501_STABLE, php: '8.4' }
          # 5.3 LTS: upstream branch MOODLE_503_STABLE did not exist on 2026-10-02 (CI error:
          # "Remote branch MOODLE_503_STABLE not found"), so these two jobs use "main".
          # Experimental until the stable branch exists; then switch to MOODLE_503_STABLE.
          - { database: mysqli, moodle-branch: main, php: '8.3', experimental: true }
          - { database: mysqli, moodle-branch: main, php: '8.4', experimental: true }

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
